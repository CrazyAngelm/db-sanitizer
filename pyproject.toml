[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "db-sanitizer"
version = "0.1.0"
description = "PostgreSQL sanitization PoC with Greenmask, LangGraph, and Ollama"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "DB Sanitizer contributors" }]
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "psutil==7.2.2",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
]

[project.scripts]
db-sanitizer = "db_sanitizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/db_sanitizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires PostgreSQL or Docker Compose",
  "real_provider: requires a real configured LLM provider",
  "security: verifies that raw PII markers never reach artifacts",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".runs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
source = ["db_sanitizer"]
branch = true
